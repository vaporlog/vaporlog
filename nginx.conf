# vaporlog — SPA + reverse proxy to the Node API.
# Mounted into the nginx container as /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # API — the Node service itself routes everything under /api,
    # so the path is proxied through unchanged (no rewrite).
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build assets (content-hashed by Vite) — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: real files win, everything else serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry point must always be revalidated so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
